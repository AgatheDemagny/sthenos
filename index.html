<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sthénos</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#8A2BE2">
</head>
<body>
  <div style="max-width: 480px; margin: auto; padding: 16px;">
    
    <!-- ÉCRAN DE CHARGEMENT & CONNEXION -->
    <section id="loadingScreen" style="text-align:center; padding-top: 50px;">
      <h2>Chargement...</h2>
    </section>

    <section id="loginScreen" class="hidden">
      <h2>Connexion</h2>
      <div class="card">
        <input type="email" id="authEmail" placeholder="Email" style="width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 12px; border: 1px solid var(--divider);">
        <input type="password" id="authPassword" placeholder="Mot de passe" style="width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 12px; border: 1px solid var(--divider);">
        <div style="display: flex; gap: 10px; margin-top: 12px;">
          <button id="btnLogin" class="primary" style="flex: 1; margin-top: 0;">Se connecter</button>
          <button id="btnSignup" class="ghost" style="flex: 1; margin-top: 0;">Créer un compte</button>
        </div>
      </div>
    </section>

    <!-- ÉCRAN D'ACCUEIL : TABLEAU DE BORD -->
    <section id="homeScreen" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
        <h2>Sthénos</h2>
        <button class="ghost" style="width:auto; padding:8px 14px; font-size:12px; margin-top: 0;" onclick="deconnexion()">Déconnexion</button>
      </div>
      
      <div style="display:grid; gap:16px;">
        <div class="card" style="border-left: 5px solid var(--primary); cursor: pointer;" onclick="showScreen('calisthenicsSetupScreen')">
          <h3 style="color: var(--primary); font-size: 20px;">🏋️‍♀️ Callisthénie</h3>
        </div>

        <div class="card" style="border-left: 5px solid var(--danger); cursor: pointer;" onclick="preparerBoxeSetup()">
          <h3 style="color: var(--danger); font-size: 20px;">🥊 Sac de frappe</h3>
        </div>
      </div>
    </section>

    <!-- ========================================= -->
    <!-- MODULE CALLISTHÉNIE                       -->
    <!-- ========================================= -->
    <!-- 1. SETUP -->
    <section id="calisthenicsSetupScreen" class="hidden">
      <h2>🏋️‍♀️ Séance Callisthénie</h2>
      <div class="card">
        <label style="font-weight: 600; color: var(--text-main);">
          Temps : <span id="lblDuree" style="color:var(--primary); font-size:20px;">30</span> minutes
        </label>
        <input type="range" id="selectDuree" min="15" max="60" step="5" value="30" 
               oninput="document.getElementById('lblDuree').innerText = this.value" 
               style="width:100%; margin: 20px 0; accent-color: var(--primary);">
        
        <button class="primary" onclick="genererApercuCallisthenie()">Programme de la séance</button>
        <button class="ghost" onclick="showScreen('homeScreen')">Retour</button>
      </div>
    </section>

    <!-- 2. PREVIEW -->
    <section id="calisthenicsPreviewScreen" class="hidden">
      <h2>📋 Programme</h2>
      <p id="workoutFormat" style="font-size:14px; color:var(--text-main); margin-bottom:16px;"></p>
      
      <div id="workoutListPreview" style="margin-bottom:20px;"></div>
      
      <button class="primary" onclick="lancerSeanceCallisthenie()">Démarrer</button>
      <button class="ghost" onclick="showScreen('calisthenicsSetupScreen')">Modifier la séance</button>
    </section>

    <!-- 3. ACTION (Timers & Séries) -->
    <section id="calisthenicsActiveScreen" class="hidden">
      <div style="text-align:center; margin-bottom:20px;">
        <span class="badge" id="caliProgressBadge" style="background:var(--primary); color:white; font-size:14px;">Exo 1 / 5 - Série 1 / 3</span>
      </div>
      
      <div class="card" style="text-align:center; padding:40px 20px; border: 2px solid var(--primary); min-height: 250px; display:flex; flex-direction:column; justify-content:center;">
        
        <!-- Infos de l'exercice -->
        <div id="caliMainInfo">
          <div id="caliExoMuscle" style="font-size:14px; color:var(--text-soft); text-transform:uppercase; font-weight:bold;">Muscle</div>
          <div id="caliExoName" style="font-size:28px; font-weight:900; color:var(--primary-strong); margin:10px 0;">Exercice</div>
          <div id="caliExoVariant" style="font-size:16px; color:var(--text-main); margin-bottom:20px;">Variante</div>
          <div id="caliExoTarget" style="font-size:32px; font-weight:900; color:var(--accent);">15 reps</div>
        </div>

        <!-- Grand Chronomètre (Masqué par défaut) -->
        <div id="caliTimerDisplay" class="hidden" style="font-size: 60px; font-weight: 900; color: var(--accent); margin: 20px 0; font-variant-numeric: tabular-nums;">
          00:10
        </div>

      </div>

      <!-- Boutons Dynamiques (Séries ou Feedback) -->
      <div id="caliActionButtons"></div>
      
      <button class="ghost" style="margin-top:30px; border:none; color: var(--text-soft);" onclick="quitterEntrainement()">⏹️ Quitter la séance</button>
    </section>


    <!-- ========================================= -->
    <!-- MODULE BOXE                               -->
    <!-- ========================================= -->

    <!-- 1. SETUP -->
    <section id="boxingSetupScreen" class="hidden">
      <h2>🥊 Séance Boxe</h2>
      <div class="card">
        <label style="font-weight: 600; color: var(--text-main);">Nombre de rounds :</label>
        <select id="selectRoundsBoxe">
          <option value="3">3 Rounds</option>
          <option value="5">5 Rounds</option>
          <option value="8" selected>8 Rounds</option>
          <option value="10">10 Rounds</option>
        </select>
        <button class="primary" style="background:linear-gradient(135deg, var(--danger), #ff4757);" onclick="genererApercuBoxe()">Programme de la séance</button>
        <button class="ghost" onclick="showScreen('homeScreen')">Retour</button>
      </div>
    </section>

    <!-- 2. PREVIEW -->
    <section id="boxingPreviewScreen" class="hidden">
      <h2>📋 Rounds</h2>
      <div id="boxingPreviewList" style="margin-bottom:20px; max-height:50vh; overflow-y:auto;"></div>
      <button class="primary" style="background:linear-gradient(135deg, var(--danger), #ff4757);" onclick="lancerTimerBoxe()">Démarrer</button>
      <button class="ghost" onclick="showScreen('boxingSetupScreen')">Modifier</button>
    </section>

    <!-- 3. ACTION -->
    <section id="boxingTimerScreen" class="hidden">
      <div style="text-align: center; padding: 20px 0;">
        <div id="boxeRoundInfo" style="font-weight:bold; color:var(--text-soft); font-size:16px; margin-bottom:8px; text-transform:uppercase;">Round 1 / 8</div>
        <div id="boxePhaseIndicator" class="badge" style="background:var(--success); color:#fff; font-size:18px; padding:8px 16px;">🥊 ACTION</div>
        
        <div id="boxeTimerDisplay" style="font-size: 80px; font-weight: 900; color: var(--primary-strong); margin: 20px 0; font-variant-numeric: tabular-nums;">05:00</div>
        
        <div class="card" style="background:rgba(233, 30, 99, 0.05); border-color:var(--danger);">
          <div style="font-size:14px; color:var(--danger); font-weight:bold;">Enchaînement en cours :</div>
          <div id="boxeCurrentCombo" style="font-size:24px; font-weight:900; margin-top:8px; color:var(--text-main);">Préparation...</div>
        </div>

        <div style="display:flex; gap:10px; margin-top:20px;">
          <button id="btnPauseBoxe" class="ghost" onclick="togglePauseBoxe()" style="flex:1;">⏸️ Pause</button>
          <button class="ghost" style="flex:1; color:var(--danger); border-color:var(--danger);" onclick="quitterBoxe()">⏹️ Quitter</button>
        </div>
      </div>
    </section>

  </div>

  <!-- FIREBASE SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  
  <!-- APP SCRIPTS -->
  <script src="js/app.js"></script>
</body>
</html>
